<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSE 211 - Airline Crew Rostering System</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #1a5276; border-bottom: 2px solid #2980b9; padding-bottom: 10px; margin-top: 0; }
        .btn { background: #27ae60; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #219653; }
        .status-card { background: #ebf5fb; border-left: 5px solid #2980b9; padding: 15px; margin: 20px 0; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #2980b9; color: white; }
        tr:hover { background-color: #f5f5f5; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✈️ Airline Crew Rostering Solution Visualizer</h1>
        <p>Department of Computer Science & Engineering — Term Project Visualizer</p>
        
        <div class="status-card">
            <strong>System Status:</strong> <span id="status">Connected to C++ Backend Engine</span>
        </div>

        <button class="btn" onclick="loadRoster()">Generate & Optimize Roster</button>

        <div id="result-area">
            <table>
                <thead>
                    <tr>
                        <th>Flight ID</th>
                        <th>Origin</th>
                        <th>Destination</th>
                        <th>Assigned Crew Pattern</th>
                    </tr>
                </thead>
                <tbody id="roster-data">
                    <tr>
                        <td colspan="4" style="text-align: center; color: #7f8c8d;">Click the button to fetch optimized solution routes from custom Graph layers.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function loadRoster() {
            document.getElementById('status').innerText = "Running greedy constraints solver...";
            fetch('/api/roster')
                .then(response => response.json())
                .then(data => {
                    let html = '';
                    data.forEach(row => {
                        html += `<tr>
                            <td><strong>${row.flightId}</strong></td>
                            <td>${row.origin}</td>
                            <td>${row.dest}</td>
                            <td><span style="color:#27ae60; font-weight:bold;">${row.crew}</span></td>
                        </tr>`;
                    });
                    document.getElementById('roster-data').innerHTML = html;
                    document.getElementById('status').innerText = "Solution successfully visualized from custom pointer structures!";
                })
                .catch(err => {
                    document.getElementById('status').innerText = "Error fetching data from C++ Core Server.";
                });
        }
    </script>
</body>
</html>
